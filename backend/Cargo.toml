[package]
name = "pitch_deck_extractor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["multipart", "macros"] }
mongodb = { version = "2.8", features = ["tokio-runtime"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
scraper = "0.19"
anyhow = "1.0"
thiserror = "1.0"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "0.6"
quick-xml = "0.31"
tempfile = "3"
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures = "0.3"
once_cell = "1.21"
image = "0.24"
hnsw_rs = "0.3"
tokio-retry = "0.3"
async-trait = "0.1"
dashmap = "5.5.3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
bytes = "1"

[[bin]]
name = "pitch_deck_extractor"
path = "src/main.rs"

[lib]
name = "pitch_deck_service" # giving library a name
path = "src/lib.rs"
